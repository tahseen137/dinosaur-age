<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Dinosaur Age — Detail</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060811;--surface:#0d1424;--surface2:#14203a;--gold:#d4a843;--gold2:#f0c060;--text:#e8e0d0;--muted:#8899aa}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#app{max-width:680px;margin:0 auto;padding:0 0 60px}

/* Header */
.top-bar{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(212,168,67,.2);position:sticky;top:0;background:var(--bg);z-index:10}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:.8rem;font-weight:600;letter-spacing:.04em;padding:6px 12px;border:1px solid rgba(212,168,67,.3);border-radius:20px;background:rgba(212,168,67,.08)}
.back-btn:active{opacity:.7}
.top-title{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;flex:1;text-align:center}

/* Hero image */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.hero{position:relative;width:100%;height:260px;overflow:hidden;background:var(--surface)}
.hero.loading{background:linear-gradient(90deg,var(--surface) 25%,rgba(255,255,255,.06) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:opacity .35s}
.hero.loading img{opacity:0}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,rgba(6,8,17,.45) 55%,transparent 100%)}
.hero-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4rem;background:var(--surface)}

/* Event header */
.event-header{padding:20px 20px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:10px}
.event-icon{font-size:2rem;margin-bottom:8px}
.event-title{font-size:1.6rem;font-weight:800;line-height:1.1;margin-bottom:4px}
.event-sub{font-size:.85rem;color:var(--muted);margin-bottom:16px}

/* Image caption */
.img-caption{padding:6px 20px;font-size:.65rem;color:var(--muted);font-style:italic;border-left:2px solid rgba(212,168,67,.3);margin:0 20px 16px}

/* Body */
.body-text{padding:0 20px;font-size:.9rem;line-height:1.75;color:rgba(232,224,208,.9);margin-bottom:24px}
.body-text p{margin-bottom:14px}

/* Quote block */
.book-quote{margin:20px;padding:16px 18px;background:rgba(212,168,67,.06);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.book-quote p{font-size:.85rem;line-height:1.65;color:rgba(232,224,208,.85);font-style:italic;margin-bottom:8px}
.book-quote cite{font-size:.7rem;color:var(--gold);font-style:normal;font-weight:600}

/* Facts */
.facts-section{margin:0 20px 20px;background:rgba(212,168,67,.05);border:1px solid rgba(212,168,67,.15);border-radius:12px;padding:16px}
.facts-title{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.fact-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:.82rem;color:rgba(232,224,208,.8);line-height:1.45}
.fact-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:5px;flex:0 0 auto}

/* More events nav */
.more-title{padding:0 20px;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.more-card{background:var(--surface);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;cursor:pointer;transition:.15s;text-decoration:none;display:block;min-height:88px;touch-action:manipulation}
.more-card:active{opacity:.65;transform:scale(.97)}
.more-card-icon{font-size:1.8rem;margin-bottom:6px}
.more-card-name{font-size:.8rem;font-weight:600;color:var(--text);line-height:1.25}
.more-card-date{font-size:.68rem;color:var(--muted);margin-top:3px}

/* Source */
.source-note{margin:24px 20px 0;padding:12px;background:rgba(255,255,255,.03);border-radius:8px;font-size:.68rem;color:var(--muted);line-height:1.5}
.source-note strong{color:var(--gold2)}

/* Loading */
#loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--muted);font-size:.85rem}
#not-found{display:none;padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
